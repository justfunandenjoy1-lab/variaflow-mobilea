name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build with Gradle
        run: |
          # প্রোজেক্ট ডিরেক্টরি শনাক্তকরণ
          PROJECT_DIR="."
          if [ -d "./VariaFlowMobile" ]; then
            PROJECT_DIR="./VariaFlowMobile"
          fi
          cd "$PROJECT_DIR"
          echo "Working in: $(pwd)"

          # gradlew স্ক্রিপ্ট না থাকলে তৈরি করা
          if [ ! -f "./gradlew" ]; then
            echo "gradlew তৈরি করা হচ্ছে..."
            gradle wrapper
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: variaflow-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
