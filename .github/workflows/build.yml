name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE"
          fi

      - name: Download Gradle 8.7 & Build APK
        run: |
          # অফিশিয়াল Gradle 8.7 ডাউনলোড (যাতে সিস্টেমের 9.7.1 কোনোভাবেই রান না হয়)
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          GRADLE_EXEC="$(pwd)/gradle-8.7/bin/gradle"

          # প্রজেক্ট ফোল্ডারে প্রবেশ
          if [ -d "./VariaFlowMobile" ]; then
            cd "./VariaFlowMobile"
          fi

          echo "Using exact Gradle version:"
          "$GRADLE_EXEC" --version

          # সরাসরি 8.7 দিয়ে APK বিল্ড
          "$GRADLE_EXEC" assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: variaflow-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
