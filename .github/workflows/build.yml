name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE"
          fi

      - name: Auto-fix Kotlin Code Errors
        run: |
          python3 -c "
          import glob, re

          # ১. PresetSelector.kt ফাইলে dp ইমপোর্ট যুক্ত করা
          for p_file in glob.glob('**/PresetSelector.kt', recursive=True):
              with open(p_file, 'r', encoding='utf-8') as f:
                  code = f.read()
              if 'import androidx.compose.ui.unit.dp' not in code:
                  code = re.sub(r'(package [^\n]+)', r'\1\nimport androidx.compose.ui.unit.dp', code, count=1)
                  with open(p_file, 'w', encoding='utf-8') as f:
                      f.write(code)
                  print('Fixed:', p_file)

          # ২. SettingsPanel.kt ফাইলে ExposedDropdownMenu সমাধান করা
          for s_file in glob.glob('**/SettingsPanel.kt', recursive=True):
              with open(s_file, 'r', encoding='utf-8') as f:
                  code = f.read()
              code = re.sub(r'\bExposedDropdownMenu\b', 'DropdownMenu', code)
              if 'import androidx.compose.material3.DropdownMenu' not in code:
                  code = re.sub(r'(package [^\n]+)', r'\1\nimport androidx.compose.material3.DropdownMenu', code, count=1)
              with open(s_file, 'w', encoding='utf-8') as f:
                  f.write(code)
              print('Fixed:', s_file)
          "

      - name: Download Gradle 8.13 & Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip
          GRADLE_EXEC="$(pwd)/gradle-8.13/bin/gradle"

          if [ -d "./VariaFlowMobile" ]; then
            cd "./VariaFlowMobile"
          fi

          "$GRADLE_EXEC" assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: variaflow-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          retention-days: 14
